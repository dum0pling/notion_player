<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Music Player - Transparent Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

  :root {
    --white: #fff;
    --primary: #755239;   
    --text: #573D2A;
    --text-sub: #fff;
  }

  * { box-sizing: border-box; }

  /* ★ 1. 스크롤바 완전 제거 및 화면 중앙 정렬 ★ */
 html, body {
    margin: 0; padding: 0;
    overflow: hidden !important;
    width: 100%;
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 40px; /* 브라운 트랙 팝업 공간 확보 */
  }

  /* ★ 2. 플레이어 크기 줄이기 (0.8 = 80% 크기) ★ */
  #app-cover {
    position: relative;
    width: 480px;
    height: 100px;
    margin-top: 0px;
    transform: scale(1); /* 0.8이나 0.85로 원하시는 크기만큼 조절 가능합니다! */
    transform-origin: center center;
  }

  #player-track {
    position: absolute;
    top: 0; left: 15px; right: 15px;
    background: #C2855D;
    padding: 13px 22px 13px 140px; 
    border-radius: 15px 15px 0 0;
    transition: top 0.4s ease;
    z-index: 1;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
  }

  #player-track.active {
    top: -95px;
  }

  #album-name { color: var(--text-sub); font-size: 13px; font-weight: 700; }

  .track-name-container {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    margin: 3px 0 8px 0;
  }

  #track-name { 
    color: var(--text); 
    font-size: 15px; 
    font-weight: 700; 
    display: inline-block;
    white-space: nowrap;
  }

  .title-text {
    display: inline-block;
    padding-right: 50px;
  }

  .title-text-duplicate {
    display: none;
    padding-right: 50px;
  }

  #track-name.is-scrolling .title-text-duplicate {
    display: inline-block;
  }

  @keyframes marquee {
    0% {
      transform: translateX(0%);
    }
    100% {
      transform: translateX(-50%);
    }
  }

  #track-time { display: flex; justify-content: space-between; font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 5px; }

  #s-area { width: 100%; height: 4px; background: #ffe8ee; border-radius: 4px; cursor: pointer; position: relative; }
  #seek-bar { width: 0%; height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.1s linear; }

  #player-content {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 110%;
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
    z-index: 2;
    display: flex;
    align-items: center;
  }

  #album-art {
   position: absolute;
    top: -28px;
    left: 15px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    background-color: #fff;
    background-size: cover;
    background-position: center;
    border: 5px solid #fff;
    z-index: 3;
    transition: all 0.3s ease;
    mask-image: radial-gradient(circle, transparent 15%, black 16%);
    -webkit-mask-image: radial-gradient(circle, transparent 15%, black 16%);
  }

  #album-art.playing { animation: spin 3s linear infinite; }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  #player-controls { 
    margin-left: 165px; 
    display: flex; 
    align-items: center; 
    gap: 15px; 
  }

  .control {
    background: none; border: none; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    color: #dfdbdf; padding: 10px; transition: 0.2s ease;
  }
  .control:hover { color: #573D2A; transform: scale(1.1); }
  .control svg { width: 24px; height: 24px; fill: currentColor; }
  
  #play-pause-button {
    background: #573D2A; color: #fff;
    width: 50px; height: 50px; border-radius: 50%;
    border: none;
    outline: none;
    padding: 0;
    box-shadow: 0 5px 15px #755239;
  }
  #play-pause-button:hover { color: #fff; background: #755239; }
</style>
</head>
<body>

<div id="app-cover">
 <div id="player-track">
  <div id="album-name">Artist Name</div>
  <div class="track-name-container">
    <div id="track-name">
      <span class="title-text">Track Title</span>
      <span class="title-text-duplicate">Track Title</span>
    </div>
  </div>
    <div id="track-time">
      <div id="current-time">00:00</div>
      <div id="track-length">00:00</div>
    </div>
    <div id="s-area">
      <div id="seek-bar"></div>
    </div>
  </div>

  <div id="player-content">
    <div id="album-art"></div>
    
    <div id="player-controls">
      <button class="control" id="play-previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="control" id="play-pause-button">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="control" id="play-next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>

    </div>
  </div>
</div>

      source: "https://github.com/dum0pling/notion_playlist/raw/refs/heads/main/music/song25.mp3"          
    },
    {
      name: "ONLY YOUR STARS!(MaM ver.)",
      artist: "MaM",
      cover: "https://github.com/dum0pling/notion_playlist/blob/main/image/cover26.jpg?raw=true", 
      source: "https://github.com/dum0pling/notion_playlist/raw/refs/heads/main/music/song26.mp3"          
    }
  ];

  let currentTrackIndex = 0;
  let audio = new Audio();
  let isPlaying = false;

  const playPauseBtn = document.getElementById("play-pause-button");
  const iconPlay = document.getElementById("icon-play");
  const iconPause = document.getElementById("icon-pause");
  const prevBtn = document.getElementById("play-previous");
  const nextBtn = document.getElementById("play-next");
  const albumArt = document.getElementById("album-art");
  const trackName = document.getElementById("track-name");
  const albumName = document.getElementById("album-name");
  const playerTrack = document.getElementById("player-track");
  const currentTimeEl = document.getElementById("current-time");
  const trackLengthEl = document.getElementById("track-length");
  const seekBar = document.getElementById("seek-bar");
  const sArea = document.getElementById("s-area");

  function loadTrack(index) {
    audio.src = tracks[index].source;
    albumArt.style.backgroundImage = `url('${tracks[index].cover}')`;
    
    const titleMain = trackName.querySelector('.title-text') || trackName;
    const titleDup = trackName.querySelector('.title-text-duplicate');

    if (titleDup) {
      titleMain.innerText = tracks[index].name;
      titleDup.innerText = tracks[index].name;
    } else {
      trackName.innerText = tracks[index].name;
    }
    albumName.innerText = tracks[index].artist;
    
    trackName.style.animation = "none";
    
    setTimeout(() => {
      const container = document.querySelector('.track-name-container');
      const mainTitle = trackName.querySelector('.title-text') || trackName;

      if (container && mainTitle) {
        const containerWidth = container.offsetWidth;
        const textWidth = mainTitle.offsetWidth;

        if (textWidth > containerWidth) {
          trackName.classList.add('is-scrolling');
          trackName.style.animation = "marquee 15s linear infinite";
        } else {
          trackName.classList.remove('is-scrolling');
          trackName.style.animation = "none";
        }
      }
    }, 50);

    audio.load();
    seekBar.style.width = "0%";
    currentTimeEl.innerText = "00:00";
    trackLengthEl.innerText = "00:00";
  }

  function playTrack() {
    audio.play();
    isPlaying = true;
    iconPlay.style.display = "none";
    iconPause.style.display = "block";
    albumArt.classList.add("playing"); 
    playerTrack.classList.add("active"); 
  }

  function pauseTrack() {
    audio.pause();
    isPlaying = false;
    iconPlay.style.display = "block";
    iconPause.style.display = "none";
    albumArt.classList.remove("playing"); 
    playerTrack.classList.remove("active"); 
  }

  playPauseBtn.addEventListener("click", () => {
    if (isPlaying) pauseTrack();
    else playTrack();
  });

  nextBtn.addEventListener("click", () => {
    currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
    loadTrack(currentTrackIndex);
    if (isPlaying) playTrack();
  });

  prevBtn.addEventListener("click", () => {
    currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
    loadTrack(currentTrackIndex);
    if (isPlaying) playTrack();
  });

  audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      seekBar.style.width = `${progressPercent}%`;

      let curMins = Math.floor(audio.currentTime / 60);
      let curSecs = Math.floor(audio.currentTime - curMins * 60);
      let durMins = Math.floor(audio.duration / 60);
      let durSecs = Math.floor(audio.duration - durMins * 60);

      if(curSecs < 10) curSecs = "0" + curSecs;
      if(curMins < 10) curMins = "0" + curMins;
      if(durSecs < 10) durSecs = "0" + durSecs;
      if(durMins < 10) durMins = "0" + durMins;

      currentTimeEl.innerText = `${curMins}:${curSecs}`;
      trackLengthEl.innerText = `${durMins}:${durSecs}`;
    }
  });

  audio.addEventListener("ended", () => {
    nextBtn.click();
  });

  sArea.addEventListener("click", (e) => {
    const rect = sArea.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;
    const clickRatio = clickX / width;
    audio.currentTime = clickRatio * audio.duration;
  });

  loadTrack(currentTrackIndex);
</script>

</html>
